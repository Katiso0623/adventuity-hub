# Deploys the Adventuity Floodline websites to Azure Static Web Apps:
#   floodline/      -> www.adventuity.co.za  (secret AZURE_STATIC_WEB_APPS_API_TOKEN)
#   floodline-com/  -> www.adventuity.com    (secret AZURE_STATIC_WEB_APPS_API_TOKEN_COM)
# Each job stays idle until its deployment token from the Azure portal is saved as a repository secret
# (Settings -> Secrets and variables -> Actions -> New repository secret). If the Azure apps were created with
# "Deployment source: GitHub", Azure adds its own workflow instead and these jobs simply stay idle.
name: Deploy Floodline to Azure
on:
  push:
    branches: [main]
    paths: ['floodline/**', 'floodline-com/**', '.github/workflows/floodline-azure.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floodline-azure
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - site: floodline
            secret: AZURE_STATIC_WEB_APPS_API_TOKEN
          - site: floodline-com
            secret: AZURE_STATIC_WEB_APPS_API_TOKEN_COM
    env:
      SWA_TOKEN: ${{ secrets[matrix.secret] }}
    steps:
      - uses: actions/checkout@v4
      - name: Waiting for the Azure connection
        if: env.SWA_TOKEN == ''
        run: echo "::notice::Add the ${{ matrix.secret }} secret to deploy ${{ matrix.site }}/ to Azure Static Web Apps."
      - name: Upload to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: ${{ matrix.site }}
          skip_app_build: true
          skip_api_build: true
