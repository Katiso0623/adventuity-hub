# Deploys the Adventuity Floodline website (folder floodline/) to Azure Static Web Apps.
# It stays idle until the deployment token from the Azure portal is saved as the repository secret
# AZURE_STATIC_WEB_APPS_API_TOKEN (Settings → Secrets and variables → Actions → New repository secret).
name: Deploy Floodline to Azure
on:
  push:
    branches: [main]
    paths: ['floodline/**', '.github/workflows/floodline-azure.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: floodline-azure
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Waiting for the Azure connection
        if: env.SWA_TOKEN == ''
        run: echo "::notice::Add the AZURE_STATIC_WEB_APPS_API_TOKEN secret to start deploying to Azure Static Web Apps."
      - name: Upload to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: floodline
          skip_app_build: true
          skip_api_build: true
