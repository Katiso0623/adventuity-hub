name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tell search engines about new and changed pages (IndexNow – Bing, Yandex, Seznam, Naver)
        continue-on-error: true
        run: |
          sleep 30
          KEYFILE=$(ls site/*.txt | grep -E '/[0-9a-f]{32}\.txt$' | head -1)
          [ -z "$KEYFILE" ] && { echo "no IndexNow key"; exit 0; }
          KEY=$(basename "$KEYFILE" .txt)
          BASE="https://katiso0623.github.io/adventuity-hub/"
          URLS=$(grep -o '<loc>[^<]*</loc>' site/sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -s -c .)
          BODY=$(jq -n -c --arg key "$KEY" --arg loc "${BASE}${KEY}.txt" --argjson urls "$URLS" '{host:"katiso0623.github.io", key:$key, keyLocation:$loc, urlList:$urls}')
          curl -sS -o /dev/null -w "IndexNow response: %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
