# Deploys the Adventuity learning portal (site/ – public pages, portal, encrypted notes) to Azure Static Web Apps,
# the same way the Floodline websites are hosted. Planned address: https://learn.adventuity.co.za
# The job stays idle until the Static Web App's deployment token is saved as the repository secret
# AZURE_STATIC_WEB_APPS_API_TOKEN_LEARN (Settings -> Secrets and variables -> Actions -> New repository secret).
# GitHub Pages keeps serving the same site at katiso0623.github.io/adventuity-hub until the new address is live.
name: Deploy portal to Azure
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/portal-azure.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-azure
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEARN }}
    steps:
      - uses: actions/checkout@v4
      - name: Waiting for the Azure connection
        if: env.SWA_TOKEN == ''
        run: echo "::notice::Add the AZURE_STATIC_WEB_APPS_API_TOKEN_LEARN secret to deploy site/ to Azure Static Web Apps."
      - name: Leave the Floodline copies out (they have their own addresses)
        if: env.SWA_TOKEN != ''
        run: rm -rf site/floodline site/floodline-com
      - name: Upload to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true
