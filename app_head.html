<title data-part>Adventuity Learning Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" data-part>
<style id="theme" data-part>
/* Layout concept: an exam-prep "lesson room" — a sticky top bar, one content column on graph-paper ground,
   bottom tab bar on phones. Subject hues are chips; the orange accent is reserved for actions. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#e8edf3; --ink:#1c3246; --ink-2:#55687a; --line:#d2dae3; --grid:rgba(28,50,70,.07);
  --accent:#1c3246; --accent-ink:#ffffff; --accent-soft:#e2eaf2;
  --fig1:#2b63a8; --fig2:#d9661e; --fig3:#1f7a4d; --fig4:#7a4bc2; --grid-line:#e3e8ee;
  --maths:#2b63a8; --maths-soft:#e3ecf8; --phys:#6f4bc2; --phys-soft:#ece6fa; --chem:#1f7a4d; --chem-soft:#e0f2e8;
  --good:#1f7a4d; --warn:#a9671a; --bad:#c2362e; --good-soft:#e0f2e8; --warn-soft:#fbeedd; --bad-soft:#fae3e1;
  --shadow:0 1px 2px rgba(21,33,58,.06),0 8px 24px -12px rgba(21,33,58,.18);
  --display:"Poppins","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1823; --surface:#152331; --surface-2:#1e3041; --ink:#e8eef4; --ink-2:#a4b4c4; --line:#2a3e51; --grid:rgba(232,238,244,.06);
  --accent:#7fb7e3; --accent-ink:#0b1620; --accent-soft:#1c3246;
  --fig1:#7eaaea; --fig2:#f39a52; --fig3:#58cf8a; --fig4:#b39cf7; --grid-line:#22344a;
  --maths:#7eaaea; --maths-soft:#1b2f4d; --phys:#b39cf7; --phys-soft:#2b2250; --chem:#58cf8a; --chem-soft:#143826;
  --good:#58cf8a; --warn:#f0b35b; --bad:#f08a80; --good-soft:#143826; --warn-soft:#3a2a12; --bad-soft:#3f1d1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1823; --surface:#152331; --surface-2:#1e3041; --ink:#e8eef4; --ink-2:#a4b4c4; --line:#2a3e51; --grid:rgba(232,238,244,.06);
  --accent:#7fb7e3; --accent-ink:#0b1620; --accent-soft:#1c3246;
  --fig1:#7eaaea; --fig2:#f39a52; --fig3:#58cf8a; --fig4:#b39cf7; --grid-line:#22344a;
  --maths:#7eaaea; --maths-soft:#1b2f4d; --phys:#b39cf7; --phys-soft:#2b2250; --chem:#58cf8a; --chem-soft:#143826;
  --good:#58cf8a; --warn:#f0b35b; --bad:#f08a80; --good-soft:#143826; --warn-soft:#3a2a12; --bad-soft:#3f1d1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
a{color:var(--maths);text-decoration-thickness:1px;text-underline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.55rem,3.4vw,2.3rem);font-weight:700}
h2{font-size:clamp(1.25rem,2.4vw,1.6rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
h4{font-size:.95rem;font-weight:700}
p{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{min-height:90px;resize:vertical}
label{font-size:.85rem;color:var(--ink-2);font-weight:500;display:block;margin-bottom:4px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;min-width:0}

.hero-top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between}
.slogan{font-family:var(--display);font-weight:500;color:var(--ink-2);font-size:.95rem;letter-spacing:.01em}
.brand b{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:.72rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;border-radius:999px;padding:8px 13px;color:var(--ink-2);font-weight:500;font-size:.92rem}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav button:hover{color:var(--ink)}
.tabbar{display:none}
.gear{display:none;margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;align-items:center;justify-content:center;color:var(--ink-2)}
.gear svg{width:20px;height:20px}
@media (max-width:480px){.cd .big{font-size:1.45rem}}
@media (max-width:700px){.logo-full{display:none}}
@media (max-width:760px){
  .nav{display:none}
  .gear.show{display:inline-flex}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{background:none;border:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;color:var(--ink-2);font-weight:500}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  main{padding-bottom:84px}
}
main{padding-block:22px 48px}
.stack{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid.cols-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid.cols-4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:600;font-size:.92rem;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:600;letter-spacing:.01em;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.maths{background:var(--maths-soft);color:var(--maths)}
.pill.phys{background:var(--phys-soft);color:var(--phys)}
.pill.chem{background:var(--chem-soft);color:var(--chem)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.wrap{white-space:normal;text-align:left;line-height:1.3;padding:5px 10px}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:22px}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;mask-image:linear-gradient(90deg,transparent 30%,#000 100%);-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 100%);pointer-events:none}
.hero>*{position:relative}
.countdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.cd{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:grid;gap:2px;min-width:0}
.cd .big{font-family:var(--mono);font-size:1.9rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.cd .big small{font-size:.8rem;color:var(--ink-2);font-family:var(--body);margin-left:4px}
.cd.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cd.past{opacity:.55}
.topic-card{display:grid;gap:8px;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);color:inherit;width:100%;position:relative}
.topic-card:hover{border-color:var(--ink-2)}
.topic-card .t{font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.2}
.topic-card .meta{font-size:.8rem;color:var(--ink-2)}
.topic-card .status{position:absolute;top:12px;right:12px}
.section{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.section>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;font-size:1rem;flex-wrap:wrap}
.section>summary>span:nth-child(2){flex:1 1 220px;min-width:0}
.section>summary::-webkit-details-marker{display:none}
.section>summary .chev{margin-left:auto;transition:transform .2s;flex:none;width:18px;height:18px;color:var(--ink-2)}
.section[open]>summary .chev{transform:rotate(180deg)}
.section .body{padding:4px 18px 18px;display:grid;gap:16px;border-top:1px solid var(--line)}
.block h4{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.block h4 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.block ul,.block ol{margin:0;padding-left:20px;display:grid;gap:6px}
.block li{min-width:0;overflow-wrap:anywhere}
.defs{display:grid;gap:8px}
.def{border-left:3px solid var(--maths);padding:6px 12px;background:var(--surface-2);border-radius:0 var(--r-sm) var(--r-sm) 0}
.def b{display:block;font-size:.85rem}
.example{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);padding:14px}
.example .q{font-weight:500;margin-bottom:10px}
.example ol{margin:0;padding-left:20px;display:grid;gap:8px}
.example .ans{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-weight:600}
.bookref{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);font-size:.86rem}
.bookref svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--ink-2)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 var(--r-sm) var(--r-sm) 0}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
mjx-container[display="true"]{margin:6px 0 !important}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.table-wrap{overflow-x:auto}
.quiz-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:var(--r-sm);padding:10px 12px;margin-top:8px}
.quiz-opt:hover{border-color:var(--ink-2)}
.quiz-opt.correct{border-color:var(--good);background:var(--good-soft)}
.quiz-opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.quiz-opt:disabled{cursor:default}
.why{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2);font-size:.9rem}
.progress-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.lesson{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.lesson .date{border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;min-width:64px;background:var(--surface-2)}
.lesson .date b{display:block;font-family:var(--mono);font-size:1.4rem;line-height:1}
.lesson .date span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.lesson.past{opacity:.65}
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:24px 16px 40px}
.overlay .inner{max-width:980px;margin:0 auto;display:grid;gap:18px}
.board{font-size:1.35rem;line-height:1.5}
.board .step{padding:12px 16px;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:12px}
.board .q{font-weight:600;font-size:1.45rem;background:var(--surface);padding:16px 18px;border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:761px){.toast{bottom:24px}}
.field{display:grid;gap:4px;min-width:0}
.sess-edit{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:grid;gap:10px;background:var(--surface-2)}
.sess-edit .grid{gap:10px}
.step-list{counter-reset:s;display:grid;gap:8px;padding-left:0;margin:0;list-style:none}
.step-list li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.step-list li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;font-weight:600}
.plan-day{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.plan-day:first-of-type{border-top:0}
.plan-day .d{font-family:var(--mono);font-size:.82rem;color:var(--ink-2);min-width:88px;padding-top:3px}
.plan-day.exam .d{color:var(--accent);font-weight:600}
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:500}
.chipbtn.maths{border-color:var(--maths);color:var(--maths)}
.chipbtn.phys{border-color:var(--phys);color:var(--phys)}
.chipbtn.chem{border-color:var(--chem);color:var(--chem)}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1}
